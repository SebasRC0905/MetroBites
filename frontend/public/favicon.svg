<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="MetroBites"
>
  <title>MetroBites</title>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6023be" />
      <stop offset="100%" stop-color="#300a66" />
    </linearGradient>
  </defs>

  <!-- Cuadro con las esquinas redondeadas del sistema de diseño -->
  <rect width="64" height="64" rx="16" fill="url(#fondo)" />

  <!--
    Versión simplificada del logotipo: solo el tazón y el vapor. La
    línea de la mesa se omite a propósito porque a 16 px (el tamaño de
    la pestaña) se convertía en una mancha gris y ensuciaba el dibujo.
  -->
  <path d="M9 31h46a23 23 0 0 1-46 0Z" fill="#ffffff" />

  <!-- Vapor -->
  <path
    d="M25 7c-3.2 3.3-3.2 6.3 0 9.6s3.2 6.3 0 9.6"
    fill="none"
    stroke="#ff9878"
    stroke-width="4.4"
    stroke-linecap="round"
  />
  <path
    d="M39.5 11c-2.5 2.6-2.5 4.9 0 7.5s2.5 4.9 0 7.5"
    fill="none"
    stroke="#ff9878"
    stroke-width="4.4"
    stroke-linecap="round"
  />
</svg>
